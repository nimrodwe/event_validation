name: Allure → GitHub Pages
run-name: "Allure → GitHub Pages (${{ github.event_name }} / ${{ github.ref_name }})"

on:
  # Every push to main runs the full suite and publishes Allure to Pages.
  push:
    branches: [main, master]
  # PRs targeting main: run tests + Allure artifact (no Pages deploy).
  pull_request:
    branches: [main, master]
  # Manual run from the Actions tab (any branch).
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force CI failure (dashboard check)"
        type: boolean
        default: false
  # Daily at 22:00 Israel time (UTC+3) → 19:00 UTC. Cron is always UTC.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: allure-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Set up Java (Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure commandline
        run: |
          ALLURE_VERSION=2.32.2
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | sudo tar -xz -C /opt/
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: out/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-

      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          CI: "true"
        run: |
          # Always run pytest so Allure has real results; force_fail fails the step afterward.
          set +e
          python -m pytest -v --tb=short
          code=$?
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "Forced CI failure for dashboard check (pytest exit=$code)"
            exit 1
          fi
          exit "$code"

      - name: Prepare Allure results history
        run: |
          mkdir -p out/allure-results
          if [ -d out/allure-history ]; then
            rm -rf out/allure-results/history
            cp -r out/allure-history out/allure-results/history
          fi

      - name: Generate Allure HTML report
        run: allure generate out/allure-results -o out/allure-report --clean

      - name: Save Allure history for next run
        if: always()
        run: |
          rm -rf out/allure-history
          if [ -d out/allure-report/history ]; then
            cp -r out/allure-report/history out/allure-history
          else
            mkdir -p out/allure-history
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: out/allure-report
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: >
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/allure-report

      - name: Fail job if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "Pytest failed — Allure report was still generated."
          exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test-and-report
    if: >
      always() &&
      needs.test-and-report.result != 'cancelled' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.event_name == 'schedule'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
