name: Allure → GitHub Pages
run-name: "Allure → GitHub Pages (${{ github.event_name }} / ${{ github.ref_name }})"

on:
  # Any push (any branch) runs tests and updates the Allure GitHub Pages site.
  push:
  # PRs: run tests + Allure artifact only (do not overwrite the live site).
  pull_request:
  # Manual run from the Actions tab (any branch).
  workflow_dispatch:
  # Daily at 22:00 Israel time (UTC+3) → 19:00 UTC. Cron is always UTC.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  # One live Pages deploy at a time so every push can refresh the site cleanly.
  group: allure-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'site' }}
  cancel-in-progress: true

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java (Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure commandline
        run: |
          ALLURE_VERSION=2.32.2
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | sudo tar -xz -C /opt/
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: out/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-

      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          CI: "true"
        run: python -m pytest -v --tb=short

      - name: Prepare Allure results history
        run: |
          mkdir -p out/allure-results
          if [ -d out/allure-history ]; then
            rm -rf out/allure-results/history
            cp -r out/allure-history out/allure-results/history
          fi

      - name: Generate Allure HTML report
        run: allure generate out/allure-results -o out/allure-report --clean

      - name: Save Allure history for next run
        if: always()
        run: |
          rm -rf out/allure-history
          if [ -d out/allure-report/history ]; then
            cp -r out/allure-report/history out/allure-history
          else
            mkdir -p out/allure-history
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: out/allure-report
          retention-days: 14

      - name: Fetch previous per-run Pages history
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: allure-pages
          path: prev-pages
          fetch-depth: 1

      - name: Assemble Pages site (latest + per-run folders)
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SITE=out/pages-site
          RID="${{ github.run_id }}"
          rm -rf "$SITE"
          mkdir -p "$SITE/runs"

          if [ -d prev-pages/runs ]; then
            cp -a prev-pages/runs/. "$SITE/runs/" || true
          fi

          rm -rf "$SITE/runs/$RID"
          mkdir -p "$SITE/runs/$RID"
          cp -a out/allure-report/. "$SITE/runs/$RID/"

          # Keep the newest 30 run folders (by numeric run id).
          mapfile -t KEEP < <(ls -1 "$SITE/runs" | sort -n | tail -n 30)
          for d in "$SITE/runs"/*; do
            [ -e "$d" ] || continue
            base=$(basename "$d")
            keep=0
            for k in "${KEEP[@]:-}"; do
              if [ "$base" = "$k" ]; then keep=1; break; fi
            done
            if [ "$keep" -eq 0 ]; then rm -rf "$d"; fi
          done

          # Latest report at site root (do not replace runs/).
          shopt -s dotglob nullglob
          for item in out/allure-report/*; do
            base=$(basename "$item")
            if [ "$base" = "runs" ]; then continue; fi
            rm -rf "$SITE/$base"
            cp -a "$item" "$SITE/"
          done

          echo "Published this run at /runs/${RID}/"
          ls -la "$SITE/runs" | head -n 40

      - name: Upload GitHub Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/pages-site

      - name: Persist Pages tree on allure-pages branch
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd out/pages-site
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init
          git checkout -B allure-pages
          git add -A
          git commit -m "Allure Pages for run ${{ github.run_id }}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" allure-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "Pytest failed — Allure report was still generated."
          exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test-and-report
    if: >
      always() &&
      needs.test-and-report.result != 'cancelled' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
