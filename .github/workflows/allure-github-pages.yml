name: Allure → GitHub Pages
run-name: "Allure → GitHub Pages (${{ github.event_name }} / ${{ github.ref_name }})"

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily at 22:00 Israel time (UTC+3) → 19:00 UTC.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write
  actions: read

# Do not cancel in-progress publishes — every run must keep its /runs/<id>/ report.
concurrency:
  group: allure-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'site' }}
  cancel-in-progress: false

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    outputs:
      pytest_failed: ${{ steps.pytest.outcome == 'failure' }}
      pytest_conclusion: ${{ steps.pytest.outcome == 'failure' && 'failure' || 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java (Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure commandline
        run: |
          ALLURE_VERSION=2.32.2
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | sudo tar -xz -C /opt/
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: out/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-

      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          CI: "true"
        run: python -m pytest -v --tb=short

      - name: Prepare Allure results history
        if: always()
        run: |
          mkdir -p out/allure-results
          if [ -d out/allure-history ]; then
            rm -rf out/allure-results/history
            cp -r out/allure-history out/allure-results/history
          fi

      - name: Generate Allure HTML report
        if: always()
        run: allure generate out/allure-results -o out/allure-report --clean

      - name: Save Allure history for next run
        if: always()
        run: |
          rm -rf out/allure-history
          if [ -d out/allure-report/history ]; then
            cp -r out/allure-report/history out/allure-history
          else
            mkdir -p out/allure-history
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: out/allure-report
          retention-days: 14

  # Separate job so pytest failure never blocks publishing this run's Allure.
  publish-allure:
    name: Publish Allure (all branches)
    needs: test-and-report
    if: always() && needs.test-and-report.result != 'cancelled' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: out/allure-report

      - name: Fetch previous per-run history
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: allure-pages
          path: prev-pages
          fetch-depth: 1

      - name: Assemble site (latest + /runs/<run_id>/)
        run: |
          set -euo pipefail
          SITE=out/pages-site
          RID="${{ github.run_id }}"
          rm -rf "$SITE"
          mkdir -p "$SITE/runs"

          if [ -d prev-pages/runs ]; then
            cp -a prev-pages/runs/. "$SITE/runs/" || true
          fi

          rm -rf "$SITE/runs/$RID"
          mkdir -p "$SITE/runs/$RID"
          cp -a out/allure-report/. "$SITE/runs/$RID/"

          mapfile -t KEEP < <(ls -1 "$SITE/runs" | sort -n | tail -n 30)
          for d in "$SITE/runs"/*; do
            [ -e "$d" ] || continue
            base=$(basename "$d")
            keep=0
            for k in "${KEEP[@]:-}"; do
              if [ "$base" = "$k" ]; then keep=1; break; fi
            done
            if [ "$keep" -eq 0 ]; then rm -rf "$d"; fi
          done

          shopt -s dotglob nullglob
          for item in out/allure-report/*; do
            base=$(basename "$item")
            if [ "$base" = "runs" ]; then continue; fi
            rm -rf "$SITE/$base"
            cp -a "$item" "$SITE/"
          done

          echo "This run: /runs/${RID}/"
          ls -1 "$SITE/runs" | tail -n 20

      - name: Write public CI catalog (ci-runs.json, no API auth needed)
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          PYTEST_CONCLUSION: ${{ needs.test-and-report.outputs.pytest_conclusion }}
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path("out/pages-site")
          runs_dir = site / "runs"
          catalog_path = site / "ci-runs.json"
          prev_path = Path("prev-pages/ci-runs.json")
          repo = os.environ["GITHUB_REPOSITORY"]
          rid = str(os.environ["GITHUB_RUN_ID"])
          # raw.githack serves allure-pages with correct MIME. github.io /runs/<id>
          # 404s when Deploy Pages is blocked for non-default branches.
          pages = f"https://raw.githack.com/{repo}/allure-pages/"

          by_id = {}
          if prev_path.is_file():
              try:
                  for row in json.loads(prev_path.read_text(encoding="utf-8")).get("runs") or []:
                      by_id[str(row["id"])] = row
              except (json.JSONDecodeError, OSError, KeyError):
                  pass

          # Keep entries for folders that still exist.
          existing = {p.name for p in runs_dir.iterdir() if p.is_dir()} if runs_dir.is_dir() else set()
          by_id = {k: v for k, v in by_id.items() if k in existing}

          conclusion = os.environ.get("PYTEST_CONCLUSION") or "success"
          by_id[rid] = {
              "id": int(rid),
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "status": "completed",
              "conclusion": conclusion,
              "event": os.environ.get("GITHUB_EVENT_NAME") or "",
              "head_branch": os.environ.get("GITHUB_REF_NAME") or "",
              "head_sha": (os.environ.get("GITHUB_SHA") or "")[:7],
              "created_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "html_url": f"https://github.com/{repo}/actions/runs/{rid}",
              "display_title": os.environ.get("GITHUB_WORKFLOW") or "Allure",
              "allure_url": pages.rstrip("/") + f"/runs/{rid}/",
          }

          # Seed any folder missing from catalog (older publishes).
          for folder in existing:
              if folder in by_id:
                  continue
              by_id[folder] = {
                  "id": int(folder) if folder.isdigit() else folder,
                  "run_number": None,
                  "status": "completed",
                  "conclusion": "",
                  "event": "",
                  "head_branch": "",
                  "head_sha": "",
                  "created_at": "",
                  "updated_at": "",
                  "html_url": f"https://github.com/{repo}/actions/runs/{folder}",
                  "display_title": "Allure",
                  "allure_url": pages.rstrip("/") + f"/runs/{folder}/",
              }

          # Rewrite legacy github.io / jsDelivr allure_url values to raw.githack.
          for row in by_id.values():
              rid_key = str(row.get("id") or "")
              if rid_key:
                  row["allure_url"] = pages.rstrip("/") + f"/runs/{rid_key}/"

          def sort_key(row):
              try:
                  return int(row["id"])
              except (TypeError, ValueError):
                  return 0

          runs = sorted(by_id.values(), key=sort_key, reverse=True)[:30]
          payload = {
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "runs": runs,
          }
          catalog_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote ci-runs.json with {len(runs)} runs")
          PY

      - name: Push allure-pages branch (source of truth for every machine)
        run: |
          set -euo pipefail
          cd out/pages-site
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init
          git checkout -B allure-pages
          git add -A
          git commit -m "Allure for run ${{ github.run_id }} (${{ github.ref_name }})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" allure-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail the workflow if pytest failed (after Allure was published).
  pytest-status:
    name: Pytest status
    needs: test-and-report
    if: always() && needs.test-and-report.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if pytest failed
        if: needs.test-and-report.outputs.pytest_failed == 'true'
        run: |
          echo "Pytest failed — Allure for this run was still published."
          exit 1
